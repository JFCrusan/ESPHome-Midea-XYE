<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">ACiQ Extreme Plus recurring Housekeeping signature</title>
<desc id="desc">A representative cooling-run event shows the EEV opening sharply at about 120.5 minutes of compressor runtime followed by a compressor power surge. Five observed events cluster tightly around 120.515 minutes.</desc>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#182230; }
  .title { font-size:30px; font-weight:700; }
  .sub { font-size:16px; fill:#52606d; }
  .panel { fill:#f7f9fc; stroke:#d9e2ec; stroke-width:1; }
  .grid { stroke:#d9e2ec; stroke-width:1; }
  .axis { font-size:13px; fill:#687585; }
  .label { font-size:16px; font-weight:650; }
  .note { font-size:14px; fill:#52606d; }
  .eev { fill:none; stroke:#275dad; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
  .power { fill:none; stroke:#d97706; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
  .marker { stroke:#8b5cf6; stroke-width:2; stroke-dasharray:7 6; }
  .pill { fill:#eef2ff; stroke:#c7d2fe; }
  .pilltext { font-size:15px; font-weight:650; fill:#4c1d95; }
  .dot { fill:#8b5cf6; }
  .mean { stroke:#4c1d95; stroke-width:2; }
</style>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="60" y="58" class="title">Recurring Housekeeping signature</text>
<text x="60" y="88" class="sub">Representative cooling event from Home Assistant history · EEV and independent compressor power</text>
<rect x="55" y="115" width="1090" height="225" rx="14" class="panel"/>
<text x="75" y="143" class="label">EEV position</text>
<text x="1115" y="143" text-anchor="end" class="note">steps</text><line x1="90" y1="317.7" x2="1110" y2="317.7" class="grid"/><text x="80" y="321.7" text-anchor="end" class="axis">250</text><line x1="90" y1="231.4" x2="1110" y2="231.4" class="grid"/><text x="80" y="235.4" text-anchor="end" class="axis">300</text><line x1="90" y1="145.0" x2="1110" y2="145.0" class="grid"/><text x="80" y="149.0" text-anchor="end" class="axis">350</text><line x1="90.0" y1="145" x2="90.0" y2="335" class="grid"/><line x1="345.0" y1="145" x2="345.0" y2="335" class="grid"/><line x1="600.0" y1="145" x2="600.0" y2="335" class="grid"/><line x1="855.0" y1="145" x2="855.0" y2="335" class="grid"/><line x1="1110.0" y1="145" x2="1110.0" y2="335" class="grid"/><polyline points="498.4,300.5 599.2,276.4 601.4,176.2 694.9,200.4 697.0,309.1 1077.7,302.2" class="eev"/><line x1="600.0" y1="145" x2="600.0" y2="335" class="marker"/><rect x="615.0" y="160" width="218" height="34" rx="17" class="pill"/><text x="724.0" y="182" text-anchor="middle" class="pilltext">EEV jump at 120.51 min</text><rect x="55" y="375" width="1090" height="225" rx="14" class="panel"/>
<text x="75" y="403" class="label">Compressor power</text>
