# One-click ACiQ / Midea XYE diagnostic snapshot helper
#
# Requires examples/aciq-diagnostics.yaml to be loaded first. It creates:
#   - button.capture_xye_snapshot
#   - text_sensor.xye_snapshot
#   - text_sensor.xye_snapshot_c0_raw
#   - text_sensor.xye_snapshot_c4_raw
#
# Press the button after each test state settles. The helper waits 2.5 seconds
# before assembling the snapshot so the normal alternating C0/C4 poll cycle has
# time to refresh both halves of the diagnostic state.
#
# The headline stays compact and readable. Two companion raw fingerprints carry
# every raw diagnostic field currently exposed by aciq-diagnostics.yaml. Keeping
# C0 and C4 separate avoids Home Assistant text-state length/truncation problems.
# All three lines are also written to the ESPHome log.
#
# Every press increments a capture sequence number so Home Assistant always
# receives visibly different states, even if every HVAC value is unchanged.
#
# Validated ACiQ C4 B16 operating-mode/state observations (2026-08-19):
#   OFF      = 0x01
#   FAN ONLY = 0x81
#   DRY      = 0x82
#   HEAT     = 0x84
#   COOL     = 0x88
#   AUTO     = 0x90
# C0 AUTO was observed as 0x98 on this unit. Raw values remain in snapshots so
# future captures can challenge these interpretations rather than hiding them.
#
# C0 B28/B29 is now treated as a high-confidence little-endian EEV position in
# steps. Long-history captures show smooth crossings through the 255/256 byte
# boundary, stepwise motion to/from a hard 480-step endpoint, and repeatable
# movement around compressor startup/shutdown and refrigeration housekeeping.
# The exact physical valve represented remains provisional.

globals:
  - id: xye_snapshot_sequence
    type: uint32_t
    restore_value: no
    initial_value: '0'

text_sensor:
  - platform: template
    id: xye_snapshot
    name: "XYE Snapshot"
    icon: mdi:clipboard-text
    update_interval: never

  - platform: template
    id: xye_snapshot_c0_raw
    name: "XYE Snapshot C0 Raw"
    icon: mdi:code-brackets
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: xye_snapshot_c4_raw
    name: "XYE Snapshot C4 Raw"
    icon: mdi:code-brackets
    entity_category: diagnostic
    update_interval: never

button:
  - platform: template
    id: xye_capture_snapshot
    name: "Capture XYE Snapshot"
    icon: mdi:camera-outline
    on_press:
      - lambda: |-
          id(xye_snapshot_sequence) += 1;
          ESP_LOGI("xye_snapshot", "Capture requested: #%lu; waiting for fresh C0/C4 polls",
                   (unsigned long) id(xye_snapshot_sequence));
      - delay: 2500ms
      - lambda: |-
          const unsigned long seq = (unsigned long) id(xye_snapshot_sequence);

          char headline[360];
          snprintf(
            headline,
            sizeof(headline),
            "#%lu | OP=%s | C0OP=0x%02X | AFAN=%s | PFAN=%s | TFAN=%s | COMP=%.0f | EEV=%.0f | B28=%.0f | B29=%.0f | META=%.0f | C4B08=%.0f | C4B10=%.0f | C4MODE=0x%02X | T4RAW=%.0f",
            seq,
            id(xye_operation_mode_text).state.c_str(),
            (unsigned int) lroundf(id(xye_c0_b08_operation_mode).state),
            id(xye_actual_fan_mode_text).state.c_str(),
            id(xye_physical_fan_speed_text).state.c_str(),
            id(xye_target_fan_mode_text).state.c_str(),
            id(xye_c0_b19_compressor_flag).state,
            id(xye_c0_candidate_eev_le).state,
            id(xye_c0_b28_unknown5).state,
            id(xye_c0_b29_unknown6).state,
            id(xye_c4_b19_20_engineering_be).state,
            id(xye_c4_b08_compressor_flags).state,
            id(xye_c4_b10_protection_flags).state,
            (unsigned int) lroundf(id(xye_c4_b16_system_status).state),
            id(xye_c4_b21_outdoor_temp_raw).state
          );

          char c0[255];
          snprintf(
            c0,
            sizeof(c0),
            "#%lu C0 | B06=%.0f B07=%.0f B08=%.0f B09=%.0f B10=%.0f B15=%.0f B16=%.0f B19=%.0f B20=%.0f B21=%.0f ERR=%.0f PROT=%.0f B26=%.0f B27=%.0f B28=%.0f B29=%.0f EEV=%.0f",
            seq,
            id(xye_c0_b06_unknown1).state,
            id(xye_c0_b07_capabilities).state,
            id(xye_c0_b08_operation_mode).state,
            id(xye_c0_b09_fan_mode).state,
            id(xye_c0_b10_target_raw).state,
            id(xye_c0_b15_current_raw).state,
            id(xye_c0_b16_unknown2).state,
            id(xye_c0_b19_compressor_flag).state,
            id(xye_c0_b20_mode_flags).state,
            id(xye_c0_b21_operation_flags).state,
            id(xye_c0_error_flags_raw).state,
            id(xye_c0_protect_flags_raw).state,
            id(xye_c0_b26_ccm_error).state,
            id(xye_c0_b27_unknown4).state,
            id(xye_c0_b28_unknown5).state,
            id(xye_c0_b29_unknown6).state,
            id(xye_c0_candidate_eev_le).state
          );

          char c4[255];
          snprintf(
            c4,
            sizeof(c4),
            "#%lu C4 | B06=%.0f B07=%.0f B08=%.0f B09=%.0f B10=%.0f B11=%.0f B12=%.0f B13=%.0f B14=%.0f B16=%.0f B17=%.0f B18=%.0f META=%.0f B21=%.0f B24=%.0f B26=%.0f B27=%.0f B28=%.0f B29=%.0f",
            seq,
            id(xye_c4_b06_indoor_fan_pwm).state,
            id(xye_c4_b07_indoor_fan_tach).state,
            id(xye_c4_b08_compressor_flags).state,
            id(xye_c4_b09_esp_profile).state,
            id(xye_c4_b10_protection_flags).state,
            id(xye_c4_b11_coil_inlet_raw).state,
            id(xye_c4_b12_coil_outlet_raw).state,
            id(xye_c4_b13_discharge_raw).state,
            id(xye_c4_b14_expansion_valve_raw).state,
            id(xye_c4_b16_system_status).state,
            id(xye_c4_b17_target_fan).state,
            id(xye_c4_b18_target_temp_raw).state,
            id(xye_c4_b19_20_engineering_be).state,
            id(xye_c4_b21_outdoor_temp_raw).state,
            id(xye_c4_b24_static_pressure).state,
            id(xye_c4_b26_compressor_subsystem).state,
            id(xye_c4_b27_outdoor_fan_subsystem).state,
            id(xye_c4_b28_4way_subsystem).state,
            id(xye_c4_b29_inverter_subsystem).state
          );

          id(xye_snapshot).publish_state(headline);
          id(xye_snapshot_c0_raw).publish_state(c0);
          id(xye_snapshot_c4_raw).publish_state(c4);

          ESP_LOGI("xye_snapshot", "XYE SNAPSHOT: %s", headline);
          ESP_LOGI("xye_snapshot", "XYE SNAPSHOT C0 RAW: %s", c0);
          ESP_LOGI("xye_snapshot", "XYE SNAPSHOT C4 RAW: %s", c4);
