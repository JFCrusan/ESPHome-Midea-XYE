# ACiQ Extreme+ Home Assistant sensor profile
#
# Tested on:
#   - ACIQ-48-PAH air handler
#   - ACIQ-48-HPD outdoor unit
#
# Requires the midea_xye climate entry to have:
#   id: heatpump_xye
#
# This is the clean, user-facing layer. It exposes fields with strong
# observational support while leaving raw byte capture to the separate
# aciq-diagnostics.yaml / aciq-byte-watch.yaml research packages.
#
# Sensor-temperature encoding:
#   Celsius = (raw - 40) / 2
#
# C0 bytes 28-29 are combined little-endian. On the tested Extreme+ system the
# resulting 0..480-ish value behaves like a stepper-driven electronic expansion
# valve position. The physical valve identity remains provisional.
#
# Home Assistant states are published only when the corresponding C0/C4 frame
# changes, avoiding repeated identical updates every poll.

sensor:
  - platform: template
    id: aciq_room_temperature_t1
    name: "ACiQ Room Temperature T1"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never

  - platform: template
    id: aciq_indoor_coil_t2a
    name: "ACiQ Indoor Coil T2A"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never

  - platform: template
    id: aciq_indoor_coil_t2b
    name: "ACiQ Indoor Coil T2B"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never

  - platform: template
    id: aciq_outdoor_coil_t3
    name: "ACiQ Outdoor Coil T3"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never

  - platform: template
    id: aciq_outdoor_ambient_t4
    name: "ACiQ Outdoor Ambient T4"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never

  - platform: template
    id: aciq_eev_position
    name: "ACiQ EEV Position"
    unit_of_measurement: "steps"
    icon: mdi:valve
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never

  - platform: template
    id: aciq_error_flags
    name: "ACiQ Error Flags Raw"
    icon: mdi:alert-circle-outline
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: aciq_protection_flags
    name: "ACiQ Protection Flags Raw"
    icon: mdi:shield-alert-outline
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

text_sensor:
  - platform: template
    id: aciq_bus_mode
    name: "ACiQ Bus Mode"
    icon: mdi:hvac
    update_interval: never

  - platform: template
    id: aciq_c4_operating_state
    name: "ACiQ C4 Operating State"
    icon: mdi:state-machine
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: aciq_actual_fan
    name: "ACiQ Actual Fan"
    icon: mdi:fan
    update_interval: never

  - platform: template
    id: aciq_target_fan
    name: "ACiQ Target Fan"
    icon: mdi:fan-auto
    update_interval: never

binary_sensor:
  - platform: template
    id: aciq_compressor_running
    name: "ACiQ Compressor Running"
    icon: mdi:engine

  - platform: template
    id: aciq_fan_auto
    name: "ACiQ Fan Auto"
    icon: mdi:fan-auto

globals:
  - id: aciq_profile_last_c0_hash
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: aciq_profile_last_c4_hash
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  - interval: 200ms
    then:
      - lambda: |-
          const uint8_t cmd =
              static_cast<uint8_t>(id(heatpump_xye).rx_data.message.frame.header.command);
          if (cmd != 0xC0 && cmd != 0xC4) return;

          const uint8_t *b = id(heatpump_xye).rx_data.raw;

          uint32_t hash = 2166136261u;
          for (int i = 0; i < 30; i++) {
            hash ^= b[i];
            hash *= 16777619u;
          }

          auto decode_temperature = [](uint8_t raw) -> float {
            return (static_cast<float>(raw) - 40.0f) / 2.0f;
          };

          auto publish_fan = [](auto *out, uint8_t raw, bool show_auto_physical) {
            const bool auto_mode = (raw & 0x80) != 0;
            const uint8_t speed = raw & 0x0F;

            const char *speed_name = nullptr;
            switch (speed) {
              case 0x00: speed_name = "OFF"; break;
              case 0x01: speed_name = "HIGH"; break;
              case 0x02: speed_name = "MEDIUM"; break;
              case 0x03: speed_name = "LOW"; break;
              case 0x04: speed_name = "LOW"; break;
              default: break;
            }

            if (auto_mode) {
              if (!show_auto_physical || speed == 0x00) {
                out->publish_state("AUTO");
              } else if (speed_name != nullptr) {
                char s[24];
                snprintf(s, sizeof(s), "AUTO + %s", speed_name);
                out->publish_state(s);
              } else {
                char s[24];
                snprintf(s, sizeof(s), "AUTO + 0x%02X", speed);
                out->publish_state(s);
              }
              return;
            }

            if (speed_name != nullptr) {
              out->publish_state(speed_name);
            } else {
              char s[24];
              snprintf(s, sizeof(s), "UNKNOWN 0x%02X", raw);
              out->publish_state(s);
            }
          };

          if (cmd == 0xC0) {
            if (hash == id(aciq_profile_last_c0_hash)) return;
            id(aciq_profile_last_c0_hash) = hash;

            id(aciq_room_temperature_t1).publish_state(decode_temperature(b[11]));
            id(aciq_indoor_coil_t2a).publish_state(decode_temperature(b[12]));
            id(aciq_indoor_coil_t2b).publish_state(decode_temperature(b[13]));
            id(aciq_outdoor_coil_t3).publish_state(decode_temperature(b[14]));

            const uint16_t eev =
                static_cast<uint16_t>(b[28]) |
                (static_cast<uint16_t>(b[29]) << 8);
            id(aciq_eev_position).publish_state(eev);

            id(aciq_error_flags).publish_state(
                static_cast<uint16_t>(b[22]) |
                (static_cast<uint16_t>(b[23]) << 8));
            id(aciq_protection_flags).publish_state(
                static_cast<uint16_t>(b[24]) |
                (static_cast<uint16_t>(b[25]) << 8));

            id(aciq_compressor_running).publish_state((b[19] & 0x01) != 0);
            id(aciq_fan_auto).publish_state((b[9] & 0x80) != 0);
            publish_fan(id(aciq_actual_fan), b[9], true);

            switch (b[8]) {
              case 0x00: id(aciq_bus_mode).publish_state("OFF"); break;
              case 0x81: id(aciq_bus_mode).publish_state("FAN ONLY"); break;
              case 0x82: id(aciq_bus_mode).publish_state("DRY"); break;
              case 0x84: id(aciq_bus_mode).publish_state("HEAT"); break;
              case 0x88: id(aciq_bus_mode).publish_state("COOL"); break;
              case 0x80:
              case 0x90:
              case 0x91:
              case 0x98:
                id(aciq_bus_mode).publish_state("AUTO");
                break;
              default: {
                char s[24];
                snprintf(s, sizeof(s), "UNKNOWN 0x%02X", b[8]);
                id(aciq_bus_mode).publish_state(s);
                break;
              }
            }
            return;
          }

          if (hash == id(aciq_profile_last_c4_hash)) return;
          id(aciq_profile_last_c4_hash) = hash;

          id(aciq_outdoor_ambient_t4).publish_state(decode_temperature(b[21]));
          publish_fan(id(aciq_target_fan), b[17], false);

          switch (b[16]) {
            case 0x01: id(aciq_c4_operating_state).publish_state("OFF"); break;
            case 0x81: id(aciq_c4_operating_state).publish_state("FAN ONLY"); break;
            case 0x82: id(aciq_c4_operating_state).publish_state("DRY"); break;
            case 0x84: id(aciq_c4_operating_state).publish_state("HEAT"); break;
            case 0x88: id(aciq_c4_operating_state).publish_state("COOL"); break;
            case 0x90: id(aciq_c4_operating_state).publish_state("AUTO"); break;
            case 0x08: id(aciq_c4_operating_state).publish_state("COOL / DISABLING"); break;
            default: {
              char s[24];
              snprintf(s, sizeof(s), "UNKNOWN 0x%02X", b[16]);
              id(aciq_c4_operating_state).publish_state(s);
              break;
            }
          }
