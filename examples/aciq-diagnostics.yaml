# ACiQ / Midea XYE diagnostic capture profile
#
# Purpose: expose raw C0 and C4 receive fields to Home Assistant without
# changing the midea_xye component's control behavior. This is intentionally
# raw-first: uncertain fields stay named by absolute byte position until they
# are validated against controlled operating-state captures.
#
# Usage:
#   1. In your midea_xye climate entry, add:
#        id: heatpump_xye
#   2. Merge the sensor: and interval: sections below into your ESPHome node.
#   3. Keep the component polling C0/C4 normally (period: 1s is fine).
#
# The interval computes a small FNV-1a fingerprint of bytes 0..29 and only
# publishes when a new C0 or C4 payload is observed, avoiding HA update spam.

sensor:
  # ---------- C0 QUERY: absolute bytes 6..29 ----------
